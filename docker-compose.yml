services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: devnyxie-prod

  # Development service (optional)
  dev:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    command: sh -c "pnpm install && pnpm dev"
    restart: unless-stopped
    container_name: devnyxie-dev
    profiles:
      - dev
