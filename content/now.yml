title: "What I'm Up To Now"
description: This page reflects my current work, projects and studies. It includes ongoing projects, recent achievements, and what I'm currently learning or exploring in the tech and design space.
content: |
  Welcome to my **Now** page! This is a snapshot of what I'm currently working on, learning, and exploring.

  *Last updated: September 19, 2025*

  ## 🚀 Current Projects

  ### Personal Website & Portfolio
  Recently migrated my personal website from Nuxt.js to Next.js with a focus on performance and developer experience. Currently enhancing the blog system, implementing better content management, and refining the overall user interface. The site now features improved SEO, better markdown processing, and a more maintainable codebase.

  ### CI/CD Service Development
  Building a lightweight, self-hosted CI/CD service using Go that integrates with GitHub webhooks. The focus is on simplicity and speed for personal projects and small team workflows. Features include automated deployment pipelines, Docker integration, and a clean web interface for monitoring builds.

  ### Portfolio Projects
  Actively working on several side projects including:
  - **Ethereal**: A creative coding experiment exploring interactive visual experiences
  - **Nigiri**: A modern web application with focus on clean UI/UX
  - Various open-source contributions and technical experiments

  ## 📚 Learning & Exploring

  ### 42 Warsaw Programming School
  Currently studying at **42 Warsaw** (2024-Now), focusing on low-level C programming, UNIX systems, and algorithmic efficiency. The program's peer-to-peer learning approach and emphasis on problem-solving is sharpening my technical skills significantly. Upon graduation, I'll earn France's RNCP Level 7 diploma (equivalent to a Master's degree).

  ### Polish Language Studies
  Actively studying Polish at **[Language School Together](https://en.together.edu.pl/)**. Recently passed my A2 exam in July 2025 and now preparing for the B1 level. Living in Warsaw has made language learning both practical and essential for deeper cultural integration.

  ### Go Deep Dive
  Deepening my knowledge of Go, particularly focusing on:
  - Concurrency patterns and goroutines
  - Building efficient web services
  - Performance optimization techniques

  ### System Design & Low-Level Programming
  Through 42 Warsaw, diving deep into:
  - Memory management and optimization
  - UNIX system programming
  - Algorithm implementation and efficiency analysis
  - Network programming and protocols

  ## 💼 Work & Freelancing

  Since 2024, I've been working as a **freelance developer**, which allows me to stay connected with real-world projects while giving me the freedom to explore new technologies—especially **Go**. Currently available for both frontend and backend projects worldwide.

  I'm particularly interested in:
  - Full-stack web applications (JavaScript/TypeScript, Go)
  - Performance optimization projects  
  - Design system implementation
  - Technical consulting
  - Migration and modernization projects

  ## 🎯 Goals

  ### Short-term (Next 3 months)
  - Progress through 42 Warsaw curriculum projects
  - Pass Polish B1 language exam
  - Complete website migration to Next.js with MDX support
  - Launch CI/CD service for personal use
  - Publish 2-3 technical articles

  ### Long-term (6-12 months)
  - Complete significant milestones at 42 Warsaw
  - Achieve Polish B2 proficiency
  - Build a SaaS product using Go
  - Expand freelance client base
  - Contribute more to open source projects

  ## 📍 Location & Availability

  Based in **Warsaw, Poland** 🇵🇱

  I'm currently balancing my studies at 42 Warsaw with freelance development work. My schedule is flexible around my academic commitments, and I'm available for remote collaborations across different time zones. The intensive nature of 42's program actually enhances my problem-solving skills, making me more efficient in client projects.

  ## 📫 Get in Touch

  If any of this resonates with you or you'd like to collaborate, feel free to reach out! I'm always interested in discussing new opportunities and interesting projects.

  ---

  *This page is inspired by Derek Sivers' [/now page movement](https://nownownow.com/about). It's a way to share what I'm focused on at this point in my life.*
