title: "What I'm Up To Now"
description: This page reflects my current work, projects and studies. It includes ongoing projects, recent achievements, and what I'm currently learning or exploring in the tech and design space.
content: |
  ## Recent Achievements
  - In December 2025, I got a new role as a **Software Engineer - Architect** at **[Capgemini](https://www.capgemini.com)**. I'm really excited and thankful for this opportunity.
  - In January 2026, I got positive results from the **Polish National Exam (B1 level)**, that I attended at Rzeszów University in November 2025. It was an important and hard step for me, and I'm happy I made it. It is my 4th language after English, Greek and Russian.

  ## Currently Learning
  - **42 Warsaw** (part-time) - Deep diving into low-level C/C++, UNIX systems, algorithms and huge projects. Working towards France's RNCP Level 7 diploma (Master's equivalent). Due to accepted job offer at Capgemini, I will pause my studies here for now.

  - **Go** - Exploring backend development with Go, building scalable systems and contributing to open source projects.

