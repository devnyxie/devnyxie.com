title: Self Hosting
description: My journey and insights into self-hosting applications, services, and infrastructure at home.
content: |
  Welcome to my **Self Hosting** page! This is where I share my experiences, setups, and learnings from running various services and applications on my own infrastructure.

  *Last updated: September 16, 2025*

  ## 🏠 Home Lab Setup

  ### Current Infrastructure
  I run a home lab setup based in Warsaw, Poland, focusing on reliability, security, and learning opportunities. The setup includes multiple services for development, productivity, and experimentation.

  ### Hardware & Network
  - **Server**: Custom built server running multiple VMs and containers
  - **Network**: Dedicated network setup with proper firewall and routing
  - **Storage**: Redundant storage with regular backups
  - **Monitoring**: Comprehensive monitoring and alerting system

  ## 🚀 Services & Applications

  ### Development & CI/CD
  - **Git Repositories**: Self-hosted Git with automated backups
  - **CI/CD Pipeline**: Custom-built lightweight CI/CD service
  - **Development Environment**: Containerized development setups
  - **Database Services**: PostgreSQL, Redis, and other databases for projects

  ### Productivity & Tools
  - **Documentation**: Knowledge management and wiki systems
  - **Project Management**: Issue tracking and project planning tools
  - **Communication**: Internal communication and collaboration tools
  - **File Storage**: Secure file sharing and storage solutions

  ### Monitoring & Security
  - **System Monitoring**: Real-time system health and performance monitoring
  - **Log Management**: Centralized logging and analysis
  - **Security Monitoring**: Network security and intrusion detection
  - **Backup Systems**: Automated backup and disaster recovery

  ## 📚 Lessons Learned

  ### Security Best Practices
  Self-hosting comes with significant security responsibilities. I've implemented:
  - Regular security updates and patch management
  - Network segmentation and firewall rules
  - Proper authentication and access control
  - Regular security audits and vulnerability assessments

  ### Reliability & Maintenance
  - Automated monitoring and alerting for all services
  - Regular maintenance schedules and update procedures
  - Backup and disaster recovery testing
  - Documentation of all processes and configurations

  ### Cost & Efficiency
  - Power consumption optimization
  - Resource utilization monitoring
  - Cost comparison with cloud alternatives
  - Scalability planning and resource allocation

  ## 🔧 Technical Stack

  ### Virtualization & Containers
  - **Docker** for application containerization
  - **Docker Compose** for multi-container applications
  - **Virtual Machines** for service isolation
  - **Container Orchestration** for complex deployments

  ### Operating Systems
  - **Linux** (primarily Debian/Ubuntu) for server environments
  - **Container OS** optimized distributions
  - **Security-hardened** configurations
  - **Automated provisioning** and configuration management

  ### Networking & Security
  - **VPN** for secure remote access
  - **Reverse Proxy** for service routing and SSL termination
  - **DNS Management** with local resolution
  - **Network Monitoring** and traffic analysis

  ## 📖 Resources & Guides

  ### Getting Started
  If you're interested in starting your own self-hosting journey, here are some recommendations:
  - Start small with a single service
  - Focus on security from day one
  - Document everything
  - Have a backup and recovery plan

  ### Community & Learning
  - Join self-hosting communities and forums
  - Learn from others' experiences and mistakes
  - Contribute back to open-source projects
  - Share your own experiences and learnings

  ---

  *This page is continuously updated as I expand my self-hosting setup and learn new things. Feel free to [reach out](/#contact) if you have questions or want to discuss self-hosting topics!*
