title: About Me
description: Learn more about my journey as a Warsaw-based Frontend & Backend Developer and my passion for creating innovative solutions.
content: |

  Hi, I'm **Timothee Afanasiev**, a Full Stack Developer based right here in Warsaw, Poland. For the past four years, I've been immersed in the world of digital product creation, focusing on building products that are not just functional, but genuinely intuitive for users.

   <img src="/images/about/personal_image.jpg" className="w-80"/>

  ## My Journey

  - My journey began in **Polish-Japanese Academy of Information Technology** (2022), where I pursued a degree in Computer Science. This academic foundation provided me with a solid understanding of core programming concepts and problem-solving skills. It was a solid stepping stone into the tech world.
    <img src="/images/about/pjatk_cover_fhd.jpg" className="w-full"/>

  - Simultaneously, I did participate in **[Epicode Bootcamp](https://epicode.com/en/)** (2022-2023), focusing on **JavaScript** and its ecosystem - both for frontend and backend, which has been my primary toolkit. It was intense for me back then, focusing on all possible aspects - Real-time Data & Interactions, Authentication, Encryption, Databases, Highly interactive applications and more - but I loved every bit of it.
    <img src="/images/about/epicode_cert.png" className="w-full"/>
    
  - After graduating, I joined **[Demandsphere](https://www.demandsphere.com/)** (2023), an American and Japanese Search Engine Optimization company, as a Junior Full Stack Developer. I got real hands-on experience working on diverse projects, from legacy system migrations to developing new features for existing applications. **Ruby**, Python, JavaScript - you name it, I worked with it. This role was crucial in shaping my team collaboration skills, understanding client requirements, and delivering solutions that met business needs.

  - After Demandsphere, I moved into **freelance development** (2024 - Now). This kept me engaged with real-world projects while giving me the flexibility to deepen my studies and explore new technologies - especially **Go**.

  - In the meantime, I decided to push myself further - so I joined **42 Warsaw** (2024 - Now). Pure, advanced Low Level Programming in C was exactly what I needed to sharpen my problem-solving skills and learn to write really efficient, optimized code. When I fully graduate, I will have French's RNCP Level 7 diploma (equivalent to a Master's degree).
    <img src="/images/about/42_kickoff.jpg" className="w-full"/>
